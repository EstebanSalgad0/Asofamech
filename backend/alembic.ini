# Alembic configuration file for ASOFAMECH backend.
# Run migrations from the backend/ directory:
#   alembic upgrade head          (new DB or after new migrations)
#   alembic stamp head            (mark existing DB as up-to-date without running)
#   alembic revision --autogenerate -m "descripcion"  (generate new migration)
#   alembic downgrade -1          (revert last migration)

[alembic]
script_location = alembic

# Naming convention for generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Add backend/ to sys.path so "from app.db import Base" works in env.py
prepend_sys_path = .

timezone = UTC
truncate_slug_length = 40

# DATABASE_URL is read from the environment in env.py — not hardcoded here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
