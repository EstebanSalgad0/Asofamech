services:
  db:
    image: postgres:15
    container_name: asofamech_db
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        INSTALL_HISTOPATHOLOGY_AI: "true"
    container_name: asofamech_backend
    environment:
      - DATABASE_URL=postgresql://app_user:app_pass@db:5432/app_db
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=llama3:8b
      - HISTO_CLASSIFIER_CHECKPOINT=/app/artifacts/histopathology-pcam-cuda/checkpoints/binary_head_pcam.pt
      - HISTO_CONCH_CHECKPOINT_REF=hf_hub:MahmoodLab/conch
      - HISTO_AUDIT_LOG_PATH=/app/artifacts/histopathology/audit_log.jsonl
      - HISTO_HF_TOKEN=${HISTO_HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "8001:8001"
    gpus: all
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app
      - ./backend/artifacts:/app/artifacts
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: asofamech_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  db_data:
  ollama_data:
  huggingface_cache:
