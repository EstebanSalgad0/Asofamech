services:
  db:
    image: pgvector/pgvector:pg15
    container_name: asofamech_db
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_HISTOPATHOLOGY_AI: "true"
        INSTALL_RAG_NEURAL: "true"
    container_name: asofamech_backend
    environment:
      - DATABASE_URL=postgresql://app_user:app_pass@db:5432/app_db
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=llama3:8b
      - HISTO_CLASSIFIER_CHECKPOINT=${HISTO_CLASSIFIER_CHECKPOINT:-/app/artifacts/histopathology/checkpoints/tri_head_camelyon17_stage16_sane_tuned_v1.pt}
      - HISTO_CONCH_CHECKPOINT_REF=${HISTO_CONCH_CHECKPOINT_REF:-hf_hub:MahmoodLab/conch}
      - HISTO_AUDIT_LOG_PATH=/app/artifacts/histopathology/audit_log.jsonl
      - HISTO_CLASSIFIER_CONFIDENCE_THRESHOLD=${HISTO_CLASSIFIER_CONFIDENCE_THRESHOLD:-0.90}
      - HISTO_TUMOR_OPERATING_THRESHOLD=${HISTO_TUMOR_OPERATING_THRESHOLD:-}
      - HISTO_USE_CHECKPOINT_OPERATING_THRESHOLD=${HISTO_USE_CHECKPOINT_OPERATING_THRESHOLD:-false}
      - HISTO_CLASSIFIER_TEMPERATURE=${HISTO_CLASSIFIER_TEMPERATURE:-}
      - HISTO_USE_CHECKPOINT_CALIBRATION=${HISTO_USE_CHECKPOINT_CALIBRATION:-false}
      - HISTO_LOW_SUSPICION_NO_METASTATIC_MIN=${HISTO_LOW_SUSPICION_NO_METASTATIC_MIN:-0.55}
      - HISTO_LOW_SUSPICION_TUMOR_MAX=${HISTO_LOW_SUSPICION_TUMOR_MAX:-0.25}
      - HISTO_SAVE_DEBUG_PATCHES=${HISTO_SAVE_DEBUG_PATCHES:-true}
      - HISTO_DEBUG_PATCH_DIR=/app/artifacts/histopathology/debug_patches
      - HISTO_QC_MAX_WHITE_FRACTION=${HISTO_QC_MAX_WHITE_FRACTION:-0.45}
      - HISTO_QC_MIN_TISSUE_FRACTION=${HISTO_QC_MIN_TISSUE_FRACTION:-0.40}
      - HISTO_QC_MIN_NUCLEAR_FRACTION=${HISTO_QC_MIN_NUCLEAR_FRACTION:-0.035}
      - HISTO_QC_MAX_DOMINANT_STROMA_FRACTION=${HISTO_QC_MAX_DOMINANT_STROMA_FRACTION:-0.55}
      - HISTO_QC_MAX_STROMA_FRACTION_WHEN_LOW_NUCLEAR=${HISTO_QC_MAX_STROMA_FRACTION_WHEN_LOW_NUCLEAR:-0.65}
      - HISTO_QC_LOW_NUCLEAR_FOR_STROMA_FRACTION=${HISTO_QC_LOW_NUCLEAR_FOR_STROMA_FRACTION:-0.12}
      - HISTO_STUDENT_MAX_HEATMAP_TILES=${HISTO_STUDENT_MAX_HEATMAP_TILES:-128}
      - HISTO_PRIVILEGED_MAX_HEATMAP_TILES=${HISTO_PRIVILEGED_MAX_HEATMAP_TILES:-128}
      - HISTO_STUDENT_HEATMAP_JOBS_PER_WINDOW=${HISTO_STUDENT_HEATMAP_JOBS_PER_WINDOW:-3}
      - HISTO_PRIVILEGED_HEATMAP_JOBS_PER_WINDOW=${HISTO_PRIVILEGED_HEATMAP_JOBS_PER_WINDOW:-20}
      - HISTO_HEATMAP_RATE_LIMIT_WINDOW_SECONDS=${HISTO_HEATMAP_RATE_LIMIT_WINDOW_SECONDS:-60}
      - HISTO_HF_TOKEN=${HISTO_HF_TOKEN:-}
      - RAG_MIN_NEURAL_SCORE=${RAG_MIN_NEURAL_SCORE:-0.48}
      - RAG_MIN_LOCAL_SCORE=${RAG_MIN_LOCAL_SCORE:-0.12}
      - HF_HOME=/root/.cache/huggingface
      - ASOFAMECH_JWT_SECRET=${ASOFAMECH_JWT_SECRET:-}
      - ASOFAMECH_ACCESS_TOKEN_EXPIRE_MINUTES=${ASOFAMECH_ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      - APP_ENV=${APP_ENV:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      - ASOFAMECH_PLATFORM_URL=${ASOFAMECH_PLATFORM_URL:-http://localhost:3000/auth}
      - ASOFAMECH_EMAIL_OUTBOX_PATH=/app/artifacts/email_outbox.jsonl
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "127.0.0.1:8001:8001"
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic/versions:/app/alembic/versions
      - ./backend/scripts:/app/scripts:ro
      - ./docs/rag_documents:/app/rag_seed_docs:ro
      - ./backend/artifacts:/app/artifacts
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: asofamech_frontend
    restart: unless-stopped
    environment:
      - API_BASE=${FRONTEND_API_BASE:-}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: asofamech_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  db_data:
  ollama_data:
  huggingface_cache:
